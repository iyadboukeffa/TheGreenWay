<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="navigation">
            <ul>
                <li>
                    <a href="#">
                        <span class="icon">
                            <ion-icon name="person-circle-outline"></ion-icon>
                        </span>
                        <span class="title"><b>Welcome, {{ session['username'] }}</b></span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('admin_dashboard') }}">
                        <span class="icon">
                            <ion-icon name="home-outline"></ion-icon>
                        </span>
                        <span class="title">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('admins_management') }}">
                        <span class="icon">
                            <ion-icon name="person-add-outline"></ion-icon>
                        </span>
                        <span class="title">Admins Management</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('driver_management') }}">
                        <span class="icon">
                            <ion-icon name="person-add-outline"></ion-icon>
                        </span>
                        <span class="title">Drivers Management</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('users_management') }}">
                        <span class="icon">
                            <ion-icon name="person-add-outline"></ion-icon>
                        </span>
                        <span class="title">Users Management</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('notifications_center') }}">
                        <span class="icon">
                            <ion-icon name="notifications-outline"></ion-icon>
                        </span>
                        <span class="title">Notifications</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('admin_help') }}">
                        <span class="icon">
                            <ion-icon name="help-outline"></ion-icon>
                        </span>
                        <span class="title">Help</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('admin_settings') }}">
                        <span class="icon">
                            <ion-icon name="settings-outline"></ion-icon>
                        </span>
                        <span class="title">Settings</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('logout') }}">
                        <span class="icon">
                            <ion-icon name="log-out-outline"></ion-icon>
                        </span>
                        <span class="title">Logout</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="main">
            <div class="topbar">
                <div class="toggle">
                    <ion-icon name="menu-outline"></ion-icon>
                </div>
                <div class="search">
                    <form method="POST" action="{{ url_for('admin_dashboard') }}">
                        <label>
                            <input type="text" name="search" placeholder="Search here">
                            <button type="submit" style="background:none;border:none;padding:0;cursor:pointer;">
                                <ion-icon name="search-outline"></ion-icon>
                            </button>
                        </label>
                    </form>
                </div>
                <div class="user">
                    <img src="{{ url_for('static', filename='images/customer01.jpg') }}" alt="">
                </div>
            </div>

            <div class="details">
                <div class="recentOrders">
                    <div class="cardHeader">
                        <h2>Edit Admin</h2>
                        <a href="{{ url_for('admins_management') }}" class="btn">Back to Admins Management</a>
                    </div>
                    <form method="POST" action="{{ url_for('edit_admin', admin_id=admin_id) }}" class="add-driver-form">
                        <div>
                            <label>Full Name: 
                                <input type="text" name="fullname" value="{{ admin[0] }}" required>
                            </label>
                            <label>Username: 
                                <input type="text" name="username" value="{{ admin[1] }}" required>
                            </label>
                            <label>Email: 
                                <input type="email" name="email" value="{{ admin[2] }}" required>
                            </label>
                            <label>Password: 
                                <input type="text" name="password" value="{{ admin[3] }}" required>
                            </label>
                            <button type="submit" class="btn btn-edit">Update Admin</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
