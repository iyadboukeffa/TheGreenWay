<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Notifications</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 400px;
            width: 100%;
        }
        .form-container {
            margin-top: 20px;
        }
        .btn-send {
            background-color: #28a745; /* لون أخضر */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-send:hover {
            background-color: #218838; /* أخضر أغمق عند التمرير */
        }
        .btn-location {
            background-color: #007bff; /* لون أزرق */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            transition: background-color 0.3s;
        }
        .btn-location:hover {
            background-color: #0069d9; /* أزرق أغمق عند التمرير */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navigation">
            <ul>
                <li>
                    <a href="#">
                        <span class="icon">
                            <ion-icon name="person-circle-outline"></ion-icon>
                        </span>
                        <span class="title"><b>Welcome {{ session['username'] }}</b></span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('user_dashboard') }}">
                        <span class="icon">
                            <ion-icon name="home-outline"></ion-icon>
                        </span>
                        <span class="title">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('add_notification') }}">
                        <span class="icon">
                            <ion-icon name="notifications-outline"></ion-icon>
                        </span>
                        <span class="title">Add Notifications</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('request_maintenance') }}">
                        <span class="icon">
                            <ion-icon name="send-outline"></ion-icon>
                        </span>
                        <span class="title">Request Maintenance</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('buy_trash_bin') }}">
                        <span class="icon">
                            <ion-icon name="cash-outline"></ion-icon>
                        </span>
                        <span class="title">Buy Trash Bin</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('help') }}">
                        <span class="icon">
                            <ion-icon name="help-outline"></ion-icon>
                        </span>
                        <span class="title">Help</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('settings') }}">
                        <span class="icon">
                            <ion-icon name="settings-outline"></ion-icon>
                        </span>
                        <span class="title">Settings</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('login') }}">
                        <span class="icon">
                            <ion-icon name="log-out-outline"></ion-icon>
                        </span>
                        <span class="title">Logout</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="main">
            <div class="topbar">
                <div class="toggle">
                    <ion-icon name="menu-outline"></ion-icon>
                </div>
                <div class="user">
                    <img src="{{ url_for('static', filename='images/customer01.jpg') }}" alt="">
                </div>
            </div>

            <div class="details">
                <div class="recentOrders">
                    <div class="cardHeader">
                        <h2>Add Notification</h2>
                    </div>
                    <div id="map"></div>
                    <div class="form-container">
                        <form method="POST">
                            <label for="location">Site Description</label><br><br>
                            <input type="text" id="location" name="location" required placeholder="Example: near home"><br><br>
                            
                            <label for="fill_percentage">Filling percentage (%):</label><br><br>
                            <input type="number" id="fill_percentage" name="fill_percentage" min="0" max="100" required placeholder="0-100"><br><br>
                            
                            <input type="hidden" id="latitude" name="latitude">
                            <input type="hidden" id="longitude" name="longitude">
                            
                            <button type="submit" class="btn-send">Send Notification</button>
                            <button type="button" class="btn-location" onclick="getLocation()">Add Location</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([24.7136, 46.6753], 10); // افتراضي: الرياض
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var marker;
        map.on('click', function(e) {
            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }
            document.getElementById('latitude').value = e.latlng.lat;
            document.getElementById('longitude').value = e.latlng.lng;
        });

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                alert("المتصفح لا يدعم تحديد الموقع!");
            }
        }

        function showPosition(position) {
            var lat = position.coords.latitude;
            var lng = position.coords.longitude;
            var latlng = [lat, lng];
            
            if (marker) {
                marker.setLatLng(latlng);
            } else {
                marker = L.marker(latlng).addTo(map);
            }
            map.setView(latlng, 15); // تكبير الخريطة للموقع
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;
        }

        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    alert("تم رفض السماح بتحديد الموقع. الرجاء تفعيل الأذونات.");
                    break;
                case error.POSITION_UNAVAILABLE:
                    alert("معلومات الموقع غير متاحة.");
                    break;
                case error.TIMEOUT:
                    alert("انتهت مهلة طلب الموقع.");
                    break;
                case error.UNKNOWN_ERROR:
                    alert("حدث خطأ غير معروف.");
                    break;
            }
        }
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
