<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .settings-form {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .settings-form h3 {
            margin-bottom: 15px;
        }
        .settings-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .settings-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .settings-form button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .settings-form button:hover {
            background-color: #0056b3;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navigation">
            <ul>
                <li>
                    <a href="#">
                        <span class="icon">
                            <ion-icon name="person-circle-outline"></ion-icon>
                        </span>
                        <span class="title"><b>Welcome, {{ session['username'] }}</b></span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('driver_dashboard') }}">
                        <span class="icon">
                            <ion-icon name="home-outline"></ion-icon>
                        </span>
                        <span class="title">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('driver_tasks') }}">
                        <span class="icon">
                            <ion-icon name="list-outline"></ion-icon>
                        </span>
                        <span class="title">Tasks</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('driver_routes') }}">
                        <span class="icon">
                            <ion-icon name="map-outline"></ion-icon>
                        </span>
                        <span class="title">Routes</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('driver_notifications') }}">
                        <span class="icon">
                            <ion-icon name="notifications-outline"></ion-icon>
                        </span>
                        <span class="title">Notifications</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('driver_help') }}">
                        <span class="icon">
                            <ion-icon name="help-outline"></ion-icon>
                        </span>
                        <span class="title">Help</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('driver_settings') }}">
                        <span class="icon">
                            <ion-icon name="settings-outline"></ion-icon>
                        </span>
                        <span class="title">Settings</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('logout') }}">
                        <span class="icon">
                            <ion-icon name="log-out-outline"></ion-icon>
                        </span>
                        <span class="title">Logout</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="main">
            <div class="topbar">
                <div class="toggle">
                    <ion-icon name="menu-outline"></ion-icon>
                </div>
                <div class="user">
                    <img src="{{ url_for('static', filename='images/customer01.jpg') }}" alt="">
                </div>
            </div>

            <div class="details">
                <div class="recentOrders">
                    <div class="cardHeader">
                        <h2>Settings</h2>
                    </div>

                    <!-- Update Profile Form -->
                    <div class="settings-form">
                        <h3>Update Profile</h3>
                        <form method="POST">
                            <label for="fullname">Full Name</label>
                            <input type="text" name="fullname" value="{{ driver[0] }}" required>
                            <label for="username">Username</label>
                            <input type="text" name="username" value="{{ driver[1] }}" required>
                            <label for="email">Email</label>
                            <input type="email" name="email" value="{{ driver[2] }}" required>
                            <button type="submit">Update Profile</button>
                        </form>
                    </div>

                    <!-- Change Password Form -->
                    <div class="settings-form">
                        <h3>Change Password</h3>
                        <form method="POST">
                            <label for="old_password">Old Password</label>
                            <input type="password" name="old_password" required>
                            <label for="new_password">New Password</label>
                            <input type="password" name="new_password" required>
                            <button type="submit">Change Password</button>
                        </form>
                    </div>

                    <!-- Feedback Message -->
                    {% if message %}
                        <div class="message {{ 'success' if 'successfully' in message else 'error' }}">
                            {{ message }}
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
