<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Code | Dan Aleko</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="wrapper">
    <form action="{{ url_for('verify_code') }}" method="POST">
      <h1>Verify Code</h1>
      <div class="input-box">
        <input type="text" name="code" placeholder="Enter the code" required>
        <i class='bx bxs-key'></i>
      </div>
      <input type="hidden" name="email" value="{{ email }}">
      <button type="submit" class="btn">Verify Code</button>
      <div class="register-link">
        <p>Didn't receive a code? <a href="{{ url_for('forgot_password') }}">Try again</a></p>
      </div>
    </form>
  </div>

  {% if error %}
    <script>
      Swal.fire({
        icon: 'error',
        title: 'Invalid Code',
        text: '{{ error }}',
        confirmButtonText: 'Try Again'
      });
    </script>
  {% endif %}
</body>
</html>
