<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form | Dan Aleko</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <div class="wrapper">
    <form action="{{ url_for('sign') }}" method="POST">
      <h1>Sign Up</h1>
      <div class="input-box">
        <input type="text" name="fullname" placeholder="Fullname" required>
        <i class='bx bxs-user'></i>
      </div>
      <div class="input-box">
        <input type="text" name="username" placeholder="Username" required>
        <i class='bx bxs-user-detail'></i>
      </div>
      <div class="input-box">
        <input type="text" name="email" placeholder="Email" required>
        <i class='bx bxs-envelope'></i>
      </div>
      <div class="input-box">
        <input type="password" name="password" placeholder="Password" required>
        <i class='bx bxs-lock-alt'></i>
      </div>
      <div class="remember-forgot">
        <label><input type="radio" name="role" value="driver"> Driver</label>
        <label><input type="radio" name="role" value="user"> User</label>
      </div>
      <button type="submit" class="btn">Create Account</button>
      <div class="register-link">
        <p>Already have an account?<a href="{{ url_for('login') }}">Login</a></p> <br> 
        <a href="{{ url_for('index') }}" class="back-link">Back</a>

      </div> 
    </form>
  </div>
</body>
</html>
