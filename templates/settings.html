<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .settings-container {
            width: 100%;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .settings-form {
            margin-bottom: 30px;
        }
        .settings-form h3 {
            margin-bottom: 15px;
        }
        .settings-form label {
            display: block;
            margin-bottom: 5px;
        }
        .settings-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .settings-form button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .settings-form button:hover {
            background-color: #0056b3;
        }
        .message {
            margin-top: 10px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navigation">
            <ul>
                <li>
                    <a href="#">
                        <span class="icon">
                            <ion-icon name="person-circle-outline"></ion-icon>
                        </span>
                        <span class="title"><b>Welcome, {{ session['username'] }}</b></span>
                    </a>
                </li>
                {% if session['role'] == 'user' %}
                <li>
                    <a href="{{ url_for('user_dashboard') }}">
                        <span class="icon">
                            <ion-icon name="home-outline"></ion-icon>
                        </span>
                        <span class="title">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('add_notification') }}">
                        <span class="icon">
                            <ion-icon name="notifications-outline"></ion-icon>
                        </span>
                        <span class="title">Add Notifications</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('request_maintenance') }}">
                        <span class="icon">
                            <ion-icon name="send-outline"></ion-icon>
                        </span>
                        <span class="title">Request Maintenance</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('buy_trash_bin') }}">
                        <span class="icon">
                            <ion-icon name="cash-outline"></ion-icon>
                        </span>
                        <span class="title">Buy Trash Bin</span>
                    </a>
                </li>
                {% endif %}
                <li>
                    <a href="{{ url_for('help') }}">
                        <span class="icon">
                            <ion-icon name="help-outline"></ion-icon>
                        </span>
                        <span class="title">Help</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('settings') }}">
                        <span class="icon">
                            <ion-icon name="settings-outline"></ion-icon>
                        </span>
                        <span class="title">Settings</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('logout') }}">
                        <span class="icon">
                            <ion-icon name="log-out-outline"></ion-icon>
                        </span>
                        <span class="title">Logout</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="main">
            <div class="topbar">
                <div class="toggle">
                    <ion-icon name="menu-outline"></ion-icon>
                </div>
                <div class="user">
                    <img src="{{ url_for('static', filename='images/customer01.jpg') }}" alt="">
                </div>
            </div>

            <div class="settings-container">
                <h2>Settings</h2><br><br>

                <!-- Change Password Form -->
                <div class="settings-form">
                    <h3>Change Password</h3><br><br>
                    <form method="POST">
                        <label for="old_password">Old Password:</label>
                        <input type="password" name="old_password" id="old_password" required>
                        <label for="new_password">New Password:</label>
                        <input type="password" name="new_password" id="new_password" required>
                        <button type="submit">Change Password</button>
                    </form>
                </div>

                <!-- Update Profile Form -->
                <div class="settings-form">
                    <h3>Update Profile</h3><br><br>
                    <form method="POST">
                        <label for="fullname">Full Name:</label>
                        <input type="text" name="fullname" id="fullname" value="{{ user[0] }}" required>
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email" value="{{ user[2] }}" required>
                        <label for="username">Username:</label>
                        <input type="text" name="username" id="username" value="{{ user[1] }}" required>
                        <button type="submit">Update Profile</button>
                    </form>
                </div>

                {% if message %}
                <div class="message">{{ message }}</div>
                {% endif %}
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
